[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "groomnote-cli"
version = "0.0.0"
description = "Engineering CLI for GroomNote AI"
requires-python = ">=3.12"
dependencies = [
  "sounddevice>=0.5,<1",
  "websocket-client>=1.8,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
